services:
  frontend:
    build:
      context: ./frontend
      target: development
    ports:
      - "5173:5173"
    environment:
      API_TARGET: http://backend:8000
    depends_on:
      - backend

  frontend-tests:
    profiles: [test]
    build:
      context: ./frontend
      target: browser-tests
    environment:
      E2E_BASE_URL: http://frontend:5173
    depends_on:
      - frontend

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

    environment:
      PYTHONPATH: /app

    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
